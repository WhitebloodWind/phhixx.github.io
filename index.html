<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Tan | Portfolio</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            /* Theme Colors */
            --bg-color: #ffffff;
            --text-main: #18181b;
            --text-muted: #71717a;
            --accent-neon: #a855f7;
            --accent-soft: #f5f3ff;
            --border-color: #e4e4e7;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        .section-hidden {
            display: none;
        }

        /* Navigation Interaction */
        .nav-link {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: var(--accent-neon);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link.active {
            color: var(--accent-neon);
            font-weight: 500;
        }

        /* Image & Card Effects */
        .image-box {
            aspect-ratio: 16 / 10;
            background-color: var(--accent-soft);
            overflow: hidden;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
            filter: brightness(0.8);
        }

        .project-card:hover img {
            transform: scale(1.04);
            filter: brightness(1);
        }
        .group:hover img {
            transform: scale(1.04);
        }
        .project-card:hover h3 {
            color: var(--accent-neon);
        }

        /* Lavender Underline Highlight */
        .highlight {
            background-image: linear-gradient(120deg, #e9d5ff 0%, #e9d5ff 100%);
            background-repeat: no-repeat;
            background-size: 100% 0.2em;
            background-position: 0 88%;
            transition: background-size 0.25s ease-in;
        }

        .highlight:hover {
            background-size: 100% 88%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: white; }
        ::-webkit-scrollbar-thumb { 
            background: #d8b4fe; 
            border-radius: 10px;
            border: 2px solid white;
        }

        .username-style {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-neon);
            margin-left: 0.8rem;
            font-weight: 600;
            vertical-align: baseline;
            opacity: 0.9;
        }
    </style>
</head>
<body class="selection:bg-purple-200 selection:text-purple-900">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full bg-white/80 backdrop-blur-xl z-50 border-b border-zinc-50">
        <div class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
            <div id="brand-name" class="text-lg font-semibold tracking-tight cursor-pointer">
                Andy Tan <span class="username-style">Phhixx</span>
            </div>
            
            <div class="flex space-x-8 text-sm font-medium text-zinc-400">
                <span id="tab-project" class="nav-link active">Project</span>
                <span id="tab-hobby" class="nav-link">Hobby</span>
                <span id="tab-info" class="nav-link">Info</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-6 pt-40 pb-24">
        
        <!-- SECTION: project -->
        <section id="view-project">
            <header class="max-w-3xl mb-32">
                <h1 id="hero-heading" class="text-4xl md:text-6xl font-light leading-tight">
                    <!-- Injected by JS -->
                </h1>
            </header>

            <div id="project-container" class="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-24">
                <!-- Projects will appear here -->
            </div>
        </section>

        <!-- SECTION: hobby -->
        <section id="view-hobby" class="section-hidden">
            <header class="max-w-2xl mb-24">
                <h1 class="text-4xl font-light mb-4">Tinkering</h1>
                <p class="text-zinc-500">Doing it for the love of the game</p>
            </header>
            <div id="hobby-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- hobby items will appear here -->
            </div>
        </section>

        <!-- SECTION: INFO -->
        <section id="view-info" class="section-hidden">
            <div class="max-w-3xl">
                <h1 class="text-4xl font-light mb-16">Bio</h1>
                <div id="bio-container" class="space-y-10 text-xl text-zinc-600 leading-relaxed font-light">
                    <!-- Bio paragraphs injected here -->
                </div>

                <div class="mt-24 pt-12 border-t border-zinc-100 flex flex-wrap gap-10 text-sm font-medium">
                    <a href="https://www.instagram.com/andy_twh_xr7?igsh=aGFsam03eWY3bTIz" class="hover:text-purple-600">Instagram</a>
                    <a href="https://github.com/WhitebloodWind" class="hover:text-purple-600">GitHub</a>
                    <a href="https://makerworld.com/en/@Phhixx112358" class="hover:text-purple-600">Makerworld</a>
                    <a id="contact-email" href="#" class="text-purple-600 hover:underline underline-offset-4">Email Me</a>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="max-w-6xl mx-auto px-6 py-12 border-t border-zinc-50 flex justify-between items-center text-[10px] uppercase tracking-widest text-zinc-300 font-bold">
        <div>© <span id="current-year"></span> Andy Tan</div>
        <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-purple-500 shadow-[0_0_8px_#a855f7]"></span>
            System Online
        </div>
    </footer>

    <script>
        const DATA = {
            name: "Andy Tan",
            username: "Phhixx",
            email: "andytwhxr7@gmail.com",
            hero: "I am <span class='text-purple-600 font-normal highlight'>a designer and engineer</span>. I strive to innovate and solve problems, <span class='text-purple-600 font-normal highlight'>having fun along the way</span>.",
            
            projects: [
                {
                    title: "Octogram: A Raspberry Pi Server",
                    tags: "Server / Fall 2025",
                    description: "Home server built on the foundation of Raspberry Pi, optimized to be power-efficient, sleek and robust.",
                    image: "Sources/Octogram.jpg",
                    link: "wip.html"
                },
                {
                    title: "Laser Engraver: CR-10S",
                    tags: "Upgrades/ Winter 2025",
                    description: "Repurposing a relic to give it a fresh new life, with laser precision.",
                    image: "Sources/PenPlotter.png",
                    link: "wip.html"
                },
                {
                    title: "The Nobara Experience",
                    tags: "Desktops / Summer 2025",
                    description: "Building up an AI workstation. Designed for aesthetics and efficiency.",
                    image: "Sources/Linuxdesktop.jpg",
                    link: "wip.html"
                },
                {
                    title:"Emcee for STEAMCUP Malaysia 2025",
                    tags: "Event / Fall 2025",
                    description: "Master or ceremony for STEAMCUP Malaysia 2025, international robotics competition held in UM",
                    image: "Sources/EmceeSolo.jpg",
                    link: "wip.html"
                },
                {
                    title:"3D-Printing Classes",
                    tags: "Class / Winter 2025",
                    description: "3D-Printing class with a focus on Robotics with TinkerCAD",
                    image: "Sources/3dPrintingClass.jpg",
                    link: "wip.html"
                }
            ],

            experiments: [
                {
                    title: "3D Printing",
                    image: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=800",
                    link: "wip.html"
                },
                {
                    title: "Building Desktops",
                    image: "https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&q=80&w=800",
                    link: "wip.html"
                },
                {
                    title: "Microcontrollers",
                    image: "https://images.unsplash.com/photo-1594623730151-3ac60271ce3c?auto=format&fit=crop&q=80&w=800",
                    link: "wip.html"
                },
                {
                    title: "Building",
                    image: "https://images.unsplash.com/photo-1594623730151-3ac60271ce3c?auto=format&fit=crop&q=80&w=800",
                    link: "wip.html"
                },
                {
                    title:"CAD Designing",
                    image: "temp",
                    link: "wip.html"
                },
                {
                    title:"Turtlebot3 with ROS and ROS2",
                    image: "temp",
                    link: "wip.html"
                },
                {
                    title:"Local AI - Hunyuan Model Generation",
                    image: "temp",
                    link: "wip.html"
                }
            ],

            biography: [
                "My name is Andy. I am a tech enthusiast, designer and engineer. I enjoy building, tinkering and reverse engineering.",
                "I spend most of my time learning and exploring new fields, 3D-Printing, building computers, microcontroller, CAD designing and more.",
                "Currently, I'm employed full time at Hong Qin Sdn Bhd as a Robotics Trainee, working on various aspects of robotics, programming and engineering."
            ]
        };

        function renderSite() {
            document.getElementById('brand-name').innerHTML = `${DATA.name} <span class="username-style">${DATA.username}</span>`;
            document.getElementById('hero-heading').innerHTML = DATA.hero;
            document.getElementById('contact-email').innerText = DATA.email;
            document.getElementById('contact-email').href = `mailto:${DATA.email}`;
            document.getElementById('current-year').innerText = new Date().getFullYear();

            const projectGrid = document.getElementById('project-container');
            projectGrid.innerHTML = DATA.projects.map(p => `
                <a href="${p.link}" class="project-card block group">
                    <div class="image-box mb-8">
                        <img src="${p.image}" alt="${p.title}">
                    </div>
                    <div class="space-y-2">
                        <div class="text-[10px] uppercase tracking-widest text-zinc-400 font-bold">${p.tags}</div>
                        <h3 class="text-2xl font-normal transition-colors duration-300">${p.title}</h3>
                        <p class="text-zinc-500 text-base leading-relaxed max-w-sm">${p.description}</p>
                    </div>
                </a>
            `).join('');

            const hobbyGrid = document.getElementById('hobby-container');
            hobbyGrid.innerHTML = DATA.experiments.map(e => `
                <a href="${e.link}" class="group cursor-pointer block"> 
                    <div class="image-box aspect-square mb-4 border-none">
                        <img src="${e.image}" alt="${e.title}">
                    </div>
                    <h3 class="text-xs font-semibold text-zinc-400 group-hover:text-purple-500 transition-colors">${e.title}</h3>
                </a>
            `).join('');

            const bioContainer = document.getElementById('bio-container');
            bioContainer.innerHTML = DATA.biography.map(text => `<p>${text}</p>`).join('');
        }

        function handleNavigation() {
            const tabs = ['project', 'hobby', 'info'];
            
            tabs.forEach(tabId => {
                const trigger = document.getElementById(`tab-${tabId}`);
                trigger.addEventListener('click', () => {
                    tabs.forEach(t => document.getElementById(`tab-${t}`).classList.remove('active'));
                    trigger.classList.add('active');
                    tabs.forEach(t => document.getElementById(`view-${t}`).classList.add('section-hidden'));
                    document.getElementById(`view-${tabId}`).classList.remove('section-hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            document.getElementById('brand-name').addEventListener('click', () => {
                document.getElementById('tab-project').click();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSite();
            handleNavigation();
        });
    </script>
</body>
</html>
